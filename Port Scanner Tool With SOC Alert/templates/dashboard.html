<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scanner Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card wide">
        <h2>Port Scanner Dashboard</h2>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST">
            <label>Target IP</label>
            <input name="target" placeholder="e.g. 127.0.0.1" required>

            <label>Ports</label>
            <input name="ports" placeholder="e.g. 22,80,443 or a range like 1-1024" required>

            <label class="checkbox-label">
                <input type="checkbox" name="consent">
                I confirm I have authorization to scan this target
            </label>

            <button type="submit">Run Scan</button>
        </form>

        {% if open_ports is not none %}
            <div class="results">
                <h3>Results</h3>
                {% if open_ports %}
                    <ul>
                        {% for port in open_ports %}
                            <li>Port {{ port }} is OPEN</li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p class="empty-state">No open ports found.</p>
                {% endif %}
            </div>
        {% endif %}

        <div class="nav-links">
            <a href="/soc">SOC Alerts</a>
        </div>
    </div>
</body>
</html>
